# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore rc-dis2-gr4-poe-juniorlesedi-main/rc-dis2-gr4-poe-juniorlesedi-main/ChatbotAI2/Program.cs- p:EnableWindowsTargeting=true
    - name: Build
      run: dotnet build --no-restore rc-dis2-gr4-poe-juniorlesedi-main/rc-dis2-gr4-poe-juniorlesedi-main/ChatbotAI2/Program.cs -p:EnableWindowsTargeting=true
    
